name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Map SuggestAPI records onto Claude Commerce products
        run: python3 check.py
